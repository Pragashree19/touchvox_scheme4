<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TouchVox Central Nurse Station</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>🏥 TouchVox Central Nurse Station</h1>

            <p>Wearable Patient Communication System</p>

        </header>


        <!-- Emergency Section -->

        <section class="emergency-section">

            <h2>🚨 Emergency Alerts</h2>

            <div id="emergencyContainer">

                <div class="empty-card">

                    No Emergency Alerts

                </div>

            </div>

        </section>


        <!-- Normal Requests -->

        <section class="request-section">

            <h2>📋 Patient Requests</h2>

            <div id="requestContainer">

                <div class="empty-card">

                    No Pending Requests

                </div>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
