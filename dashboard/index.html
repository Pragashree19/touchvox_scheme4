<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TouchVox Nurse Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <!-- HEADER -->

    <header class="topbar">

        <div>

            <h1>🏥 TouchVox</h1>

            <span class="subtitle">
                Wearable Patient Communication System
            </span>

        </div>

        <div class="live">

            <span class="dot"></span>

            LIVE

        </div>

    </header>


    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">

            <h2 id="activeCalls">0</h2>

            <p>Active Calls</p>

        </div>

        <div class="stat-card emergency">

            <h2 id="emergencyCount">0</h2>

            <p>Emergency Alerts</p>

        </div>

        <div class="stat-card">

            <h2 id="todayCalls">0</h2>

            <p>Total Calls Today</p>

        </div>

        <div class="stat-card">

            <h2 id="roomCount">1</h2>

            <p>Rooms Online</p>

        </div>

    </section>


    <!-- EMERGENCY -->

    <section>

        <h2 class="sectionTitle">

            🚨 Emergency Alerts

        </h2>

        <div id="emergencyContainer" class="emergencyGrid">

        </div>

    </section>



    <!-- PATIENT REQUESTS -->

    <section>

        <h2 class="sectionTitle">

            📋 Patient Requests

        </h2>

        <div id="requestContainer" class="requestGrid">

        </div>

    </section>



</div>

<script src="script.js"></script>

</body>

</html>
